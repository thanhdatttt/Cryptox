services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cryptox
      POSTGRES_PASSWORD: cryptox
      POSTGRES_DB: cryptox
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptox -d cryptox"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PORT: 3000
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:3000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
