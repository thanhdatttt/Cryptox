services:
  postgres-dev:
    image: postgres:17
    environment:
      POSTGRES_USER: cryptox
      POSTGRES_PASSWORD: ${CRYPTOX_LOCAL_POSTGRES_PASSWORD:?Run npm run db:local:prepare first}
      POSTGRES_DB: cryptox_development
    ports: ["55432:5432"]
    volumes: [cryptox_pgdata_development:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptox -d cryptox_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: cryptox
      POSTGRES_PASSWORD: ${CRYPTOX_LOCAL_POSTGRES_PASSWORD:?Run npm run db:local:prepare first}
      POSTGRES_DB: cryptox_test
    ports: ["55433:5432"]
    volumes: [cryptox_pgdata_test:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptox -d cryptox_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration-runner:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
    entrypoint: ["node"]

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PORT: 3000
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      VITE_BACKEND_URL: http://backend:3000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cryptox_pgdata_development:
  cryptox_pgdata_test:
