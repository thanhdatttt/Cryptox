services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cryptox
      POSTGRES_PASSWORD: cryptox
      POSTGRES_DB: cryptox
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptox -d cryptox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  seed-dev-market:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      NODE_ENV: development
      MARKET_DATA_PROVIDER: DEMO
      MARKET_DATA_SEED_MODE: DEMO
    command: ["npm", "run", "seed:dev"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PORT: 3000
      RUNTIME_PROFILE: ${RUNTIME_PROFILE:-DEVELOPMENT}
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for the durable backend}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-BINANCE}
      MARKET_DATA_BINANCE_REST_URL: ${MARKET_DATA_BINANCE_REST_URL:-https://api.binance.com}
      MARKET_DATA_BINANCE_WS_URL: ${MARKET_DATA_BINANCE_WS_URL:-wss://stream.binance.com:9443}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-COINDESK_RSS}
      STRATEGY_MODEL_ENDPOINT: ${STRATEGY_MODEL_ENDPOINT:?Set STRATEGY_MODEL_ENDPOINT for the durable backend}
      STRATEGY_MODEL_NAME: ${STRATEGY_MODEL_NAME:?Set STRATEGY_MODEL_NAME for the durable backend}
      STRATEGY_LLM_API_KEY: ${STRATEGY_LLM_API_KEY:?Set STRATEGY_LLM_API_KEY for the durable backend}
      STRATEGY_MODEL_VERSION: ${STRATEGY_MODEL_VERSION:-}
      STRATEGY_PROMPT_VERSION: ${STRATEGY_PROMPT_VERSION:-1}
      STRATEGY_MODEL_TIMEOUT_MS: ${STRATEGY_MODEL_TIMEOUT_MS:-15000}
      BACKTEST_RECOVERY_INTERVAL_MS: ${BACKTEST_RECOVERY_INTERVAL_MS:-30000}
      BACKTEST_WORKER_CONCURRENCY: ${BACKTEST_WORKER_CONCURRENCY:-1}
      BACKTEST_DEFAULT_INITIAL_CAPITAL: ${BACKTEST_DEFAULT_INITIAL_CAPITAL:-1000}
      BACKTEST_DEFAULT_FEE_RATE_PERCENT: ${BACKTEST_DEFAULT_FEE_RATE_PERCENT:-0}
      BACKTEST_DEFAULT_SLIPPAGE_BPS: ${BACKTEST_DEFAULT_SLIPPAGE_BPS:-5}
      BACKTEST_DEFAULT_MAX_ATTEMPTS: ${BACKTEST_DEFAULT_MAX_ATTEMPTS:-1}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backtest-worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      REDIS_URL: redis://redis:6379
      BACKTEST_WORKER_CONCURRENCY: ${BACKTEST_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      # Vite exposes this value to the browser, so it must use the host-published API address.
      VITE_BACKEND_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
