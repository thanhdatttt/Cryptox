services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cryptox
      POSTGRES_PASSWORD: cryptox
      POSTGRES_DB: cryptox
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptox -d cryptox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }

  seed-dev-market:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      NODE_ENV: development
    command: ["npm", "run", "seed:dev"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backtest-worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://cryptox:cryptox@postgres:5432/cryptox
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      # Vite exposes this value to the browser, so it must use the host-published API address.
      VITE_BACKEND_URL: http://localhost:3000
    ports: ["5173:5173"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
