schema: spec-driven

context: |
  Crypto Strategy Lab is an educational experiment platform for configuring,
  combining, searching, backtesting, evaluating, ranking, and visualizing crypto
  strategies with supporting news and sentiment capabilities.

  Read authority-bearing sources in this order:
  1. docs/assignment/Crypto Strategy Lab – Đồ án cuối kỳ.pdf
  2. docs/requirements.md
  3. accepted ADRs, including explicit supersession relationships
  4. docs/architecture.md and docs/data-model.md
  5. active capability specifications under openspec/specs/
  6. an approved active change, when one exists
  7. AGENTS.md operational rules

  OpenSpec is a specification and change-management aid. It does not override the
  instructor assignment, reviewed requirements, accepted ADRs, or approved
  architecture. Archived changes are historical and non-authoritative.

rules:
  design:
    - Keep capability specifications concise and trace them to requirement IDs.
    - Reference executable TypeScript contracts; do not copy full normative interfaces into Markdown.
    - Preserve accepted ADR and archived-change history; supersede decisions explicitly.
    - Keep deferred features out of active normative documentation unless clearly labelled deferred or future evolution.
  tasks:
    - Use an OpenSpec change when coordinated design/specification review is useful; it is not mandatory for every small task.
    - Normally keep at most one cross-cutting active change unless changes are demonstrably independent.
    - Treat unavailable validation tooling as UNVERIFIED or BLOCKED, never as PASS.
